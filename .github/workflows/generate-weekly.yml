name: Generate weekly veille
on:
  schedule:
    - cron: "30 4 * * 1"
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "scripts/generate.mjs"
      - "data/sources.json"
      - ".github/workflows/generate-weekly.yml"
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Generate in-depth weekly legal report
        run: npm run generate
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: gpt-5.6-sol
      - name: Commit new edition
        run: |
          git config user.name "Veille IP Bot"
          git config user.email "actions@users.noreply.github.com"
          git add public/latest.json public/reports
          git diff --cached --quiet || git commit -m "Generate in-depth weekly IP watch"
          git push
